# Core
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=2048

# Peripherals
CONFIG_GPIO=y
CONFIG_NET_L2_ETHERNET=y

# Logs
CONFIG_LOG=y
CONFIG_NET_LOG=y
# CONFIG_NET_DHCPV4_LOG_LEVEL_DBG=y
# CONFIG_NET_ICMPV4_LOG_LEVEL_DBG=y;
# CONFIG_NET_ICMPV6_LOG_LEVEL_DBG=y;
CONFIG_NET_L2_ETHERNET_LOG_LEVEL_DBG=y;
CONFIG_MDIO_LOG_LEVEL_WRN=y
# CONFIG_OS_LOG_LEVEL_WRN=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SHELL=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
# CONFIG_POSIX_API=y
CONFIG_NET_CONFIG_SETTINGS=y
# CONFIG_NET_LOG=y
# CONFIG_ETHERNET_LOG_LEVEL=4
# CONFIG_NET_L2_ETHERNET_LOG_LEVEL=4

# Static IPv4 address
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.0.500"
# CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# CONFIG_NET_CONFIG_MY_IPV4_GW="192.168.0.1"
# CONFIG_NET_SHELL=y

CONFIG_NET_IF_MAX_IPV4_COUNT=2
# CONFIG_NET_IF_MAX_IPV6_COUNT=2
# CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
# CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=5
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=3
CONFIG_ZVFS_POLL_MAX=9

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20

# CONFIG_NET_HOSTNAME_ENABLE=y
# CONFIG_NET_HOSTNAME_UNIQUE=n
# CONFIG_NET_HOSTNAME="uptp"

CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_INIT_STACKS=y
