# Core
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SIZE_OPTIMIZATIONS=y

# Peripherals
CONFIG_GPIO=y
CONFIG_NET_L2_ETHERNET=y
# CONFIG_ETH_WCH_MULTICAST_FILTER=y
CONFIG_SPI=y
CONFIG_LED_STRIP=y

# Logs
CONFIG_LOG=y
# CONFIG_LOG_DEFAULT_LEVEL=2
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_MDNS_RESPONDER_LOG_LEVEL_DBG=y
# CONFIG_DNS_RESOLVER_LOG_LEVEL_DBG=y
# CONFIG_NET_IF_LOG_LEVEL_DBG=y
# CONFIG_NET_LOG=y

# Shell
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# CONFIG_SHELL_BACKEND_TELNET=y  # Size-Optimise
# CONFIG_SHELL_TELNET_SUPPORT_COMMAND=y  # Size-Optimise

# Networking
CONFIG_NETWORKING=y
# CONFIG_NET_SHELL=y
CONFIG_NET_STATISTICS=y
CONFIG_NET_CONFIG_AUTO_INIT=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_IPV6=n
CONFIG_NET_IPV4=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_SOCKETS=y
CONFIG_POSIX_API=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_PTP=y
CONFIG_PTP_CLOCK_SHELL=y

# CONFIG_NET_IF_MAX_IPV6_COUNT=3
CONFIG_NET_IF_MAX_IPV4_COUNT=3
# CONFIG_NET_IF_UNICAST_IPV6_ADDR_COUNT=3
# CONFIG_NET_IF_MCAST_IPV6_ADDR_COUNT=5
CONFIG_NET_IF_MCAST_IPV4_ADDR_COUNT=3
CONFIG_ZVFS_POLL_MAX=9

CONFIG_NET_PKT_RX_COUNT=10
CONFIG_NET_PKT_TX_COUNT=10
CONFIG_NET_BUF_RX_COUNT=20
CONFIG_NET_BUF_TX_COUNT=20

CONFIG_NET_HOSTNAME_ENABLE=y
CONFIG_NET_HOSTNAME_UNIQUE=n
CONFIG_NET_HOSTNAME="uptp"

CONFIG_MDNS_RESPONDER=y
CONFIG_DNS_SD=y
CONFIG_MDNS_RESPONDER_DNS_SD=y
